<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="12 12" opacity="0.4" />

  <!-- Microphone / Soundwave Body -->
  <g filter="url(#glow)">
    <!-- Central Sound Waves (Equalizer) -->
    <rect x="136" y="216" width="16" height="80" rx="8" fill="url(#accentGrad)" opacity="0.75" />
    <rect x="176" y="176" width="16" height="160" rx="8" fill="url(#glowGrad)" />
    <rect x="216" y="136" width="16" height="240" rx="8" fill="url(#accentGrad)" />
    
    <!-- Central Mic capsule -->
    <rect x="240" y="160" width="32" height="110" rx="16" fill="#ffffff" />
    <path d="M220 220 C220 280 292 280 292 220" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="256" y1="274" x2="256" y2="330" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="228" y1="330" x2="284" y2="330" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

    <!-- Symmetrical Sound Waves Right side -->
    <rect x="296" y="136" width="16" height="240" rx="8" fill="url(#accentGrad)" />
    <rect x="336" y="176" width="16" height="160" rx="8" fill="url(#glowGrad)" />
    <rect x="376" y="216" width="16" height="80" rx="8" fill="url(#accentGrad)" opacity="0.75" />
  </g>

  <!-- Sparkle AI Star -->
  <path d="M370 120 Q370 150 400 150 Q370 150 370 180 Q370 150 340 150 Q370 150 370 120 Z" fill="#6ee7b7" />
  <path d="M140 340 Q140 360 160 360 Q140 360 140 380 Q140 360 120 360 Q140 360 140 340 Z" fill="#34d399" opacity="0.8" />
</svg>
